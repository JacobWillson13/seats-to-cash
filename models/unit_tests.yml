version: 2

unit_tests:
  - name: proration_line_recognizes_over_remaining_days
    description: >
      A seat added on June 16 is billed on the July 1 invoice as a proration line for June 16-30
      ($4.00, BILLING_DESIGN example 1). Its revenue is spread over those 15 days at $0.27 a day
      with the $0.22 residual on June 30. A negative discount line rounds away from zero.
    model: int_line_revenue_daily
    given:
      - input: ref('int_invoice_lines')
        rows:
          - {line_id: L1, tailnet_id: t1, is_internal: false, line_class: proration, service_start: 2026-06-16, service_end: 2026-06-30, amount_usd: 4.00}
          - {line_id: D1, tailnet_id: t1, is_internal: false, line_class: discount, service_start: 2026-07-01, service_end: 2026-07-31, amount_usd: -12.00}
    expect:
      rows:
          - {line_id: L1, revenue_date: 2026-06-16, revenue_usd: 0.27}
          - {line_id: L1, revenue_date: 2026-06-17, revenue_usd: 0.27}
          - {line_id: L1, revenue_date: 2026-06-18, revenue_usd: 0.27}
